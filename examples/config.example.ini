# cctv-overlay configuration.
#
# Copy to ~/.config/cctv-overlay/config.ini (this file holds NO secrets).
# The recorder password goes in secrets.ini next to it (mode 0600) or in the
# CCTV_OVERLAY_PASSWORD environment variable. See secrets.example.ini.
#
# Syntax notes: comments are full lines starting with '#'. Do NOT put a comment
# after a value on the same line; it would become part of the value.

[general]
# debug | info | warning | error
# log_level = info
# focused | primary | <connector, e.g. DP-1>
# monitor = focused
# start_hidden = true

[overlay]
width = 480
height = 270
# top-left | top-right | bottom-left | bottom-right
anchor = top-right
margin_x = 24
margin_y = 24
# overlay | top
layer = overlay
show_label = true
show_status = true
# opacity = 1.0

[stream]
# tcp | udp
transport = tcp
# 0 = main stream, 1 = sub stream (default; lower latency and bandwidth)
subtype = 1
# vaapi | vaapi-copy | auto-safe | no
hwdec = vaapi
preview_snapshot = true
preload_next = false
reconnect = true

[recorder]
# Placeholder address: set this to your recorder. 192.168.1.100 is an example only.
host = 192.168.1.100
port = 554
username = viewer
path = /cam/realmonitor

# Cameras are cycled in the order they appear in this file.
[camera.front]
name = Front Door
channel = 1

[camera.driveway]
name = Driveway
channel = 2
# subtype = 0

# Any RTSP source can bypass the recorder URL builder. Discouraged: the URL
# would contain a secret.
# [camera.other]
# name = Other
# url = rtsp://user:pass@host.example.invalid:554/stream

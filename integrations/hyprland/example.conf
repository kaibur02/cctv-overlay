# cctv-overlay: EXAMPLE key bindings for classic hyprlang configuration (Hyprland 0.54 and earlier).
#
# Nothing here is applied automatically. Copy the lines you want into YOUR OWN hyprland.conf by hand,
# and choose your own keys. The keys below are placeholders only.
#
# The commands:
#   cctv-overlay toggle   show or hide the overlay
#   cctv-overlay next     next camera (opens the overlay if hidden)
#   cctv-overlay prev     previous camera (opens the overlay if hidden)

# Example modifier; change to suit.
$mainMod = SUPER

bind = $mainMod, F9, exec, cctv-overlay toggle
bind = $mainMod, F10, exec, cctv-overlay next
bind = $mainMod SHIFT, F10, exec, cctv-overlay prev
